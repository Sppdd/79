name: video-engine image

# Builds the GPU container in CI (it's ~10 GB — too big to build on a laptop) and pushes it to GHCR,
# where Nebius Serverless can pull it.

on:
  push:
    branches: [main]
    paths: ["video-engine/**", ".github/workflows/video-engine.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The CUDA + torch layers need more space than the default runner has free.
      - uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: true

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: video-engine
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/notereel-video-engine:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
